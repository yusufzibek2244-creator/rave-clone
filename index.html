<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rOOms</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        body { user-select: none; -webkit-user-select: none; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 10px; }
        .screen { display: none; }
        .active { display: flex; }
    </style>
</head>
<body class="bg-[#121212] text-white min-h-screen font-sans">

    <div id="authScreen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-[#121212] p-6">
        <h1 class="text-6xl font-black mb-12">r<span class="text-blue-500">OO</span>ms</h1>
        <div class="w-full max-w-sm space-y-4">
            <input type="text" id="usernameInput" placeholder="Kullanıcı Adı" class="w-full bg-[#1e1e1e] p-4 rounded-xl border border-[#2d2d2d]">
            <button onclick="App.login()" class="w-full bg-blue-500 py-4 rounded-xl font-bold">Giriş Yap</button>
        </div>
    </div>

    <div id="appContainer">
        </div>

    <script>
        // Uygulamanın Merkezi (Tüm mantık burada tek bir çatı altında)
        const App = {
            user: "Misafir",
            ws: null,
            API_KEY: "AIzaSyD269hfWkPpCCuhK0ZF1qMUUQaY44JEMWE",

            login() {
                const name = document.getElementById('usernameInput').value;
                if(!name) return alert("İsim gir!");
                this.user = name;
                document.getElementById('authScreen').classList.add('hidden');
                this.renderLobby();
            },

            renderLobby() {
                document.getElementById('appContainer').innerHTML = `
                    <div class="p-6">
                        <header class="flex justify-between items-center mb-8">
                            <h1 class="text-2xl font-black">rOOms</h1>
                            <div class="bg-[#1e1e1e] px-4 py-2 rounded-full text-xs">${this.user}</div>
                        </header>
                        <button onclick="App.renderSearch()" class="w-full bg-blue-500 p-4 rounded-xl font-bold">Yeni Oda Kur</button>
                    </div>`;
            },

            renderSearch() {
                document.getElementById('appContainer').innerHTML = `
                    <div class="p-6">
                        <button onclick="App.renderLobby()" class="mb-4">← Geri</button>
                        <input type="text" id="ytSearch" class="w-full p-4 rounded-xl bg-[#1e1e1e] mb-2" placeholder="YouTube'da Ara...">
                        <button onclick="App.doSearch()" class="w-full bg-blue-500 p-3 rounded-xl">Ara</button>
                        <div id="results" class="mt-4 space-y-2"></div>
                    </div>`;
            },

            doSearch() {
                const q = document.getElementById('ytSearch').value;
                fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=5&q=${q}&type=video&key=${this.API_KEY}`)
                    .then(r => r.json())
                    .then(data => {
                        const res = document.getElementById('results');
                        res.innerHTML = "";
                        data.items.forEach(i => {
                            res.innerHTML += `<div onclick="App.joinRoom('${i.id.videoId}')" class="p-3 bg-[#1e1e1e] rounded-lg cursor-pointer">${i.snippet.title}</div>`;
                        });
                    });
            },

            joinRoom(vId) {
                document.getElementById('appContainer').innerHTML = `
                    <div class="h-screen flex flex-col">
                        <div id="player" class="w-full h-1/2 bg-black"></div>
                        <div id="chat" class="flex-1 p-4 overflow-y-auto"></div>
                        <input type="text" id="chatInput" class="p-4 bg-[#1e1e1e]" placeholder="Mesaj...">
                    </div>`;
                new YT.Player('player', { height: '100%', width: '100%', videoId: vId });
            }
        };
    </script>
</body>
</html>
