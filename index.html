<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>rOOms</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { rooms: { bg: '#121212', panel: '#1e1e1e', border: '#2d2d2d', accent: '#2196f3', text: '#e0e0e0' } } } } }
    </script>
    <style>
        body { user-select: none; -webkit-user-select: none; }
        input { user-select: text; -webkit-user-select: text; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 10px; }
    </style>
</head>
<body class="bg-rooms-bg text-rooms-text min-h-screen p-0 font-sans flex flex-col antialiased">

    <div id="lobbyScreen" class="flex flex-col flex-1 h-screen overflow-y-auto">
        <header class="flex justify-between items-center px-6 py-4 border-b border-rooms-border sticky top-0 bg-rooms-bg/95 backdrop-blur z-10">
            <h1 class="text-2xl font-black tracking-wider text-white">r<span class="text-rooms-accent">OO</span>ms</h1>
            <div class="text-xs font-mono bg-rooms-panel px-3 py-1.5 rounded-full border border-rooms-border" id="lobbyUserBadge">User</div>
        </header>

        <div class="p-6 space-y-4">
            <h3 class="text-xs font-bold uppercase tracking-widest text-gray-500">Platformlar</h3>
            <div class="grid grid-cols-3 gap-4">
                <button onclick="goToSearch()" class="flex flex-col items-center justify-center p-4 bg-rooms-panel border border-rooms-border rounded-2xl transition active:scale-95 hover:border-rooms-accent">
                    <div class="w-12 h-12 bg-red-600 rounded-xl flex items-center justify-center shadow-lg shadow-red-900/20"><svg class="w-7 h-7 text-white fill-current" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93-.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg></div>
                    <span class="text-xs font-semibold mt-2 text-gray-300">YouTube</span>
                </button>
            </div>
        </div>

        <div class="p-6 space-y-4 flex-1 flex flex-col">
            <h3 class="text-xs font-bold uppercase tracking-widest text-gray-500">Canlı İzleme Odaları</h3>
            <div id="publicRoomsContainer" class="space-y-3 flex-1"></div>
        </div>
    </div>

    <div id="searchScreen" class="flex flex-col flex-1 h-screen hidden bg-rooms-bg">
        <header class="flex items-center gap-3 px-4 py-4 border-b border-rooms-border bg-rooms-panel">
            <button onclick="goToLobby()" class="text-xl p-2 text-gray-400">←</button>
            <div class="flex-1 relative">
                <input type="text" id="youtubeSearchInput" onkeypress="if(event.key==='Enter') performSearch()" placeholder="YouTube'da Ara..." class="w-full bg-rooms-bg px-4 py-3 rounded-xl border border-rooms-border text-sm text-white">
                <button onclick="performSearch()" class="absolute right-3 top-3 text-gray-400">🔍</button>
            </div>
        </header>
        <div id="searchResults" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
        <div id="roomSetupModal" class="fixed inset-x-0 bottom-0 bg-rooms-panel border-t p-6 rounded-t-3xl transform translate-y-full transition-transform z-50">
            <h4 class="text-lg font-bold text-white mb-4">Gizlilik Ayarı</h4>
            <div class="grid grid-cols-2 gap-3 mb-6">
                <div onclick="selectPrivacy('public')" id="opt-public" class="p-4 border-2 border-rooms-accent bg-rooms-accent/10 rounded-xl cursor-pointer">🌍 Herkese Açık</div>
                <div onclick="selectPrivacy('private')" id="opt-private" class="p-4 border-2 border-rooms-border bg-rooms-bg rounded-xl cursor-pointer">🔒 Gizli</div>
            </div>
            <button onclick="finalizeRoomCreation()" class="w-full bg-rooms-accent text-white py-4 rounded-2xl font-bold">Odayı Başlat 🎬</button>
        </div>
        <div id="modalBackdrop" onclick="closeSetupModal()" class="fixed inset-0 bg-black/60 hidden z-40"></div>
    </div>

    <div id="roomScreen" class="flex flex-col lg:flex-row flex-1 h-screen overflow-hidden hidden">
        <div id="videoContainer" class="flex-1 bg-black"><div id="player"></div></div>
        <div class="w-full lg:w-80 bg-rooms-panel flex flex-col">
            <div id="chatMessages" class="flex-1 p-4 overflow-y-auto"></div>
            <div class="p-4 bg-rooms-bg"><input type="text" id="chatInput" onkeypress="if(event.key==='Enter') sendChatMessage()" class="w-full p-2 bg-rooms-panel rounded-lg text-white" placeholder="Mesaj yaz..."></div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player, ws, activeVideoId, currentRoomId;
        let isRoomPublic = true;
        const API_KEY = "AIzaSyD269hfWkPpCCuhK0ZF1qMUUQaY44JEMWE";

        function showScreen(id) {
            ['lobbyScreen', 'searchScreen', 'roomScreen'].forEach(s => document.getElementById(s).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function goToLobby() { showScreen('lobbyScreen'); }
        function goToSearch() { showScreen('searchScreen'); }

        function performSearch() {
            const q = document.getElementById('youtubeSearchInput').value;
            fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=5&q=${q}&type=video&key=${API_KEY}`)
                .then(r => r.json())
                .then(data => {
                    const res = document.getElementById('searchResults');
                    res.innerHTML = "";
                    data.items.forEach(item => {
                        res.innerHTML += `<div onclick="openSetupModal('${item.id.videoId}', '${item.snippet.title.replace(/'/g, "\\'")}')" class="p-3 bg-rooms-panel rounded-xl cursor-pointer hover:border-rooms-accent border border-transparent">${item.snippet.title}</div>`;
                    });
                });
        }

        function openSetupModal(vId, title) {
            activeVideoId = vId;
            document.getElementById('selectedVideoTitle') ? document.getElementById('selectedVideoTitle').innerText = title : null;
            document.getElementById('modalBackdrop').classList.remove('hidden');
            document.getElementById('roomSetupModal').classList.remove('translate-y-full');
        }

        function closeSetupModal() {
            document.getElementById('roomSetupModal').classList.add('translate-y-full');
            document.getElementById('modalBackdrop').classList.add('hidden');
        }

        function finalizeRoomCreation() {
            closeSetupModal();
            currentRoomId = Math.floor(Math.random()*9000);
            setupRoomLayout(currentRoomId, activeVideoId);
        }

        function setupRoomLayout(id, vId) {
            showScreen('roomScreen');
            player = new YT.Player('player', { height: '100%', width: '100%', videoId: vId });
            ws = new WebSocket(`wss://${window.location.host}/ws/${id}`);
            ws.onmessage = (e) => {
                const data = JSON.parse(e.data);
                if(data.type === 'chat') addChat(data.sender, data.text);
            };
        }

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            ws.send(JSON.stringify({type: 'chat', sender: "User", text: input.value}));
            input.value = "";
        }

        function addChat(sender, text) {
            document.getElementById('chatMessages').innerHTML += `<div><b>${sender}:</b> ${text}</div>`;
        }
    </script>
</body>
</html>
