<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>rOOms</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { rooms: { bg: '#121212', panel: '#1e1e1e', border: '#2d2d2d', accent: '#2196f3', text: '#e0e0e0' } } } } }
    </script>
    <style>
        body { user-select: none; -webkit-user-select: none; }
        input { user-select: text; -webkit-user-select: text; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 10px; }
    </style>
</head>
<body class="bg-rooms-bg text-rooms-text min-h-screen p-0 font-sans flex flex-col antialiased">

    <div id="lobbyScreen" class="flex flex-col flex-1 h-screen overflow-y-auto">
        <header class="flex justify-between items-center px-6 py-4 border-b border-rooms-border sticky top-0 bg-rooms-bg/95 backdrop-blur z-10">
            <h1 class="text-2xl font-black tracking-wider text-white">r<span class="text-rooms-accent">OO</span>ms</h1>
            <div class="text-xs font-mono bg-rooms-panel px-3 py-1.5 rounded-full border border-rooms-border" id="lobbyUserBadge">...</div>
        </header>
        <div class="p-6 space-y-4">
            <button onclick="goToSearch()" class="w-full bg-rooms-panel p-4 border border-rooms-border rounded-2xl">YouTube Arama</button>
        </div>
        <div id="publicRoomsContainer" class="p-6 space-y-3"></div>
    </div>

    <div id="searchScreen" class="hidden flex flex-col flex-1 h-screen bg-rooms-bg p-6">
        <button onclick="goToLobby()" class="text-white mb-4">← Geri</button>
        <input type="text" id="youtubeSearchInput" placeholder="YouTube'da Ara..." class="w-full bg-rooms-panel p-3 rounded-xl border border-rooms-border text-white">
        <button onclick="performSearch()" class="mt-2 w-full bg-rooms-accent p-3 rounded-xl text-white">Ara</button>
        <div id="searchResults" class="mt-4 space-y-3"></div>
    </div>

    <div id="roomScreen" class="hidden flex flex-col h-screen">
        <div id="player" class="w-full h-1/2 bg-black"></div>
        <div id="chatMessages" class="flex-1 p-4 overflow-y-auto text-white"></div>
        <input type="text" id="chatInput" class="w-full p-4 bg-rooms-panel text-white" placeholder="Mesaj...">
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player, ws, myUsername = "User-" + Math.floor(Math.random()*9000);
        document.getElementById('lobbyUserBadge').innerText = myUsername;

        function showScreen(id) {
            ['lobbyScreen', 'searchScreen', 'roomScreen'].forEach(s => document.getElementById(s).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function goToLobby() { showScreen('lobbyScreen'); }
        function goToSearch() { showScreen('searchScreen'); }

        function performSearch() {
            const q = document.getElementById('youtubeSearchInput').value;
            fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&q=${q}&type=video&key=AIzaSyD269hfWkPpCCuhK0ZF1qMUUQaY44JEMWE`)
            .then(r => r.json()).then(data => {
                const res = document.getElementById('searchResults');
                res.innerHTML = "";
                data.items.forEach(i => {
                    res.innerHTML += `<div onclick="startRoom('${i.id.videoId}')" class="p-3 bg-rooms-panel rounded-lg cursor-pointer">${i.snippet.title}</div>`;
                });
            });
        }

        function startRoom(vId) {
            showScreen('roomScreen');
            player = new YT.Player('player', { height: '100%', width: '100%', videoId: vId });
        }
    </script>
</body>
</html>
