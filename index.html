<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>rOOms</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        /* Giriş ekranını en üste sabitle */
        #authOverlay { position: fixed; inset: 0; z-index: 9999; background: #121212; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        /* Asıl uygulamayı başlangıçta gizle */
        #mainApp { display: none; }
    </style>
</head>
<body class="bg-[#121212] text-white">

    <div id="authOverlay">
        <h1 class="text-6xl font-black mb-10">r<span class="text-blue-500">OO</span>ms</h1>
        <div class="w-full max-w-sm space-y-4 px-6">
            <input type="text" id="usernameInput" placeholder="Kullanıcı Adı" class="w-full bg-[#1e1e1e] p-4 rounded-xl border border-[#2d2d2d]">
            <button onclick="unlockApp()" class="w-full bg-blue-500 py-4 rounded-xl font-bold">Giriş Yap</button>
        </div>
    </div>

    <div id="mainApp">
        </div>

    <script>
        // Giriş yaptıktan sonra çağrılacak fonksiyon
        function unlockApp() {
            const name = document.getElementById('usernameInput').value;
            if(!name) return alert("İsim gir!");
            
            // Kullanıcı adını global değişkene ata
            window.myUsername = name; 
            
            // Giriş ekranını kapat, uygulamayı aç
            document.getElementById('authOverlay').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
        }

        // --- SENİN ESKİ SCRIPT BLOĞUN BURAYA GELECEK ---
        // Buraya kendi orijinal scriptlerinin tamamını yapıştır.
        // Artık uygulama otomatik olarak #mainApp içinde çalışacak.
    </script>
</body>
</html>
